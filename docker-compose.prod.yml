# Production stack — TAD-001 DEP-001/002/003 (Hostinger VPS + Docker + Nginx).
# MongoDB is real Atlas (external, via MONGODB_URI) — not run as a container here.
name: wapp-prod

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: ./apps/api/.env
    depends_on:
      - redis
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    env_file: ./apps/web/.env
    expose:
      - "3000"

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    restart: unless-stopped
    env_file: ./apps/admin/.env
    expose:
      - "3001"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./docker/nginx/certs:/etc/nginx/certs:ro   # mount real TLS certs here (SEC-001)
    depends_on:
      - api
      - web
      - admin

volumes:
  redis_data:
