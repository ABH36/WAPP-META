# TAD-001 DEP-003 — Nginx reverse proxy: HTTPS termination, static asset
# serving, reverse proxy, compression. Domain names are placeholders — set the
# real production domains before deploying (see docs/GTM-001 / PRD-008 for the
# public-facing domain, and SDP-001 §3 for why admin is a separate host).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/javascript text/css;
  client_max_body_size 1m; # SEC-016 — request size limit; file uploads bypass Nginx via direct Cloudinary upload.

  upstream wapp_web {
    server web:3000;
  }

  upstream wapp_admin {
    server admin:3001;
  }

  upstream wapp_api {
    server api:4000;
  }

  # ---- Public website + workspace app ----
  server {
    listen 80;
    server_name app.wapp.example; # replace with the real production domain

    location /api/ {
      proxy_pass http://wapp_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://wapp_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ---- Platform Administration (isolated host, per SDP-001 §3) ----
  server {
    listen 80;
    server_name admin.wapp.example; # replace with the real production domain

    location / {
      proxy_pass http://wapp_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # HTTPS (SEC-001 — mandatory) is terminated here once real certificates are
  # provisioned (e.g. Certbot/Let's Encrypt on the Hostinger VPS) — a `listen
  # 443 ssl` server block per host is intentionally not templated with fake
  # paths; add it during actual environment provisioning, not before.
}
